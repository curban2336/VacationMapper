<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.maptiler.com/maptiler-geocoding-control/v2.1.7/leaflet.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-geocoding-control/v2.1.7/style.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <title>Hello from PetMapper!</title>
</head>

<body>
    <div id="container-main">
        <div id="map"></div>

        <script id="map-script" src="map.js"></script>
        <script>
            var map = L.map('map').setView([51.505, -0.09], 13);
            var markerList = [];
            var lines = [];
            var locationIndex = 0;
            let selectedLat = null;
            let selectedLng = null;
            let selectedMarkerData = null;
            let isLinkMode = false;
            let linkStartMarkerData = null;
            let pendingGeocodeMove = false;
            const geoKey = '9OPgXOKt7nnq7dXCmHus';
            L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${geoKey}`, {
                tileSize: 512,
                maxZoom: 19,
                zoomOffset: -1,
                minZoom: 1,
                attribution: "\u003ca href=\"https://www.maptiler.com/copyright/\" target=\"_blank\"\u003e\u0026copy; MapTiler\u003c/a\u003e \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\"\u003e\u0026copy; OpenStreetMap contributors\u003c/a\u003e",
                crossOrigin: true
            }).addTo(map);

            const geocodingControl = L.control.maptilerGeocoding({
                apiKey: geoKey,
                position: 'topright',
                placeholder: 'Search for places ...',
                noResultsLabel: 'No results found',
            }).addTo(map);

            const menuControl = L.control({ position: 'topleft' });
            menuControl.onAdd = function () {
                const container = L.DomUtil.create('div', 'leaflet-control action-menu-control');

                const menuWrapper = L.DomUtil.create('div', 'action-menu-wrapper action-menu-left', container);

                const menuToggleButton = L.DomUtil.create('button', 'map-action-button', menuWrapper);
                menuToggleButton.id = 'menuToggleButton';
                menuToggleButton.type = 'button';
                menuToggleButton.textContent = '☰';
                menuToggleButton.style.display = 'block';

                const menuPanel = L.DomUtil.create('div', 'action-menu-panel', menuWrapper);
                menuPanel.id = 'actionMenuPanel';
                menuPanel.style.display = 'none';

                menuPanel.innerHTML = `
                    <button id="saveSlot1" class="map-action-button menu-item-button" type="button">Save Slot 1</button>
                    <button id="loadSlot1" class="map-action-button menu-item-button" type="button">Load Slot 1</button>
                    <button id="saveSlot2" class="map-action-button menu-item-button" type="button">Save Slot 2</button>
                    <button id="loadSlot2" class="map-action-button menu-item-button" type="button">Load Slot 2</button>
                    <button id="saveSlot3" class="map-action-button menu-item-button" type="button">Save Slot 3</button>
                    <button id="loadSlot3" class="map-action-button menu-item-button" type="button">Load Slot 3</button>
                `;

                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                return container;
            };
            menuControl.addTo(map);

            const actionControl = L.control({ position: 'topright' });
            actionControl.onAdd = function () {
                const container = L.DomUtil.create('div', 'leaflet-control action-button-control');
                container.style.display = 'flex';
                container.style.gap = '8px';

                const linkButton = L.DomUtil.create('button', 'map-action-button', container);
                linkButton.id = 'linkActionButton';
                linkButton.type = 'button';
                linkButton.textContent = 'Make Link';
                linkButton.style.display = 'none';

                const button = L.DomUtil.create('button', 'map-action-button', container);
                button.id = 'actionButton';
                button.type = 'button';
                button.textContent = 'Save Location';
                button.style.display = 'none';

                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                return container;
            };
            actionControl.addTo(map);

            const setSelectedFromEvent = function (event, eventName) {
                const detail = event?.detail || event || {};
                const center = detail.center;
                const featureCenter = detail.feature?.center;
                const featureCoords = detail.feature?.geometry?.coordinates;
                const latlng = detail.latlng || detail.location;

                if (Array.isArray(featureCenter) && featureCenter.length >= 2) {
                    selectedLng = featureCenter[0];
                    selectedLat = featureCenter[1];
                    pendingGeocodeMove = true;
                    //console.log('Selected location:', 'featurecenter', detail, { selectedLat, selectedLng });
                }
            };

            geocodingControl.addEventListener('select', function (event) {
                setSelectedFromEvent(event, 'select');
            });

            const info = document.getElementById('info');
            const actionButton = document.getElementById('actionButton');
            const linkActionButton = document.getElementById('linkActionButton');
            const menuToggleButton = document.getElementById('menuToggleButton');
            const actionMenuPanel = document.getElementById('actionMenuPanel');

            map.on('movestart', function () {
                if (!pendingGeocodeMove || !actionButton) return;
                actionButton.style.display = 'block';
                pendingGeocodeMove = false;
            });

            const closeActionMenu = () => {
                if (actionMenuPanel) {
                    actionMenuPanel.style.display = 'none';
                }
            };

            const clearMapData = () => {
                markerList.forEach((markerData) => {
                    map.removeLayer(markerData.marker);
                });

                lines.forEach((lineData) => {
                    map.removeLayer(lineData.polyLine);
                });

                markerList = [];
                lines = [];
                selectedMarkerData = null;
                isLinkMode = false;
                linkStartMarkerData = null;
                if (linkActionButton) {
                    linkActionButton.textContent = 'Make Link';
                    linkActionButton.style.display = 'none';
                }
            };

            if (menuToggleButton) {
                menuToggleButton.addEventListener('click', function () {
                    if (!actionMenuPanel) return;
                    actionMenuPanel.style.display = actionMenuPanel.style.display === 'none' ? 'grid' : 'none';
                    if (actionMenuPanel.style.display === 'grid') {
                        menuToggleButton.textContent = 'X';
                    }
                    else {
                        menuToggleButton.textContent = '☰';
                    }
                });
            }

            const bindMenuAction = (buttonId, action) => {
                const button = document.getElementById(buttonId);
                if (!button) return;
                button.addEventListener('click', function () {
                    action();
                    closeActionMenu();
                });
            };

            bindMenuAction('saveSlot1', () => {
                saveMarkers(1);
                saveLines(1);
                menuToggleButton.textContent = '☰';
            });
            bindMenuAction('saveSlot2', () => {
                saveMarkers(2);
                saveLines(2);
                menuToggleButton.textContent = '☰';
            });
            bindMenuAction('saveSlot3', () => {
                saveMarkers(3);
                saveLines(3);
                menuToggleButton.textContent = '☰';
            });
            bindMenuAction('loadSlot1', () => {
                clearMapData();
                menuToggleButton.textContent = '☰';
                retrieveMarkers(1);
                retrieveLines(1);
            });
            bindMenuAction('loadSlot2', () => {
                clearMapData();
                menuToggleButton.textContent = '☰';
                retrieveMarkers(2);
                retrieveLines(2);
            });
            bindMenuAction('loadSlot3', () => {
                clearMapData();
                menuToggleButton.textContent = '☰';
                retrieveMarkers(3);
                retrieveLines(3);
            });

            if (actionButton) {
                actionButton.addEventListener('click', function () {
                    // if (typeof selectedLat !== 'number' || typeof selectedLng !== 'number') {
                    //     console.warn('No selected coordinates yet.', { selectedLat, selectedLng });
                    //     return;
                    // }
                    AddMarker(selectedLat, selectedLng);
                    // Hide button again
                    this.style.display = 'none';
                });
            }

            if (linkActionButton) {
                linkActionButton.addEventListener('click', function () {
                    if (!selectedMarkerData) return;

                    isLinkMode = true;
                    linkStartMarkerData = selectedMarkerData;
                    this.textContent = 'Select 2nd Marker';
                    if (info) {
                        info.textContent = 'Link mode enabled: click another marker to create a line.';
                    }
                });
            }

            const AddMarker = (lat, lng, notes = '') => {
                if (typeof lat !== 'number' || typeof lng !== 'number') return;

                const leafletMarker = L.marker([lat, lng]).addTo(map);
                const markerData = { marker: leafletMarker, notes: notes || '' };
                markerList.push(markerData);

                leafletMarker.on('click', () => {
                    selectedMarkerData = markerData;
                    if (linkActionButton) {
                        linkActionButton.style.display = 'block';
                    }

                    if (isLinkMode && linkStartMarkerData && linkStartMarkerData !== markerData) {
                        const startLatLng = linkStartMarkerData.marker.getLatLng();
                        const endLatLng = markerData.marker.getLatLng();
                        const polyLine = L.polyline([startLatLng, endLatLng]).addTo(map);

                        lines.push({
                            from: linkStartMarkerData,
                            to: markerData,
                            polyLine
                        });

                        isLinkMode = false;
                        linkStartMarkerData = null;
                        if (linkActionButton) {
                            linkActionButton.textContent = 'Make Link';
                        }
                        if (info) {
                            info.textContent = 'Link created.';
                        }
                    }
                });

                const index = locationIndex++
                const noteId = `note-${locationIndex}`;
                const removeID = `remove-${locationIndex}`;
                leafletMarker.bindPopup(`
                    <div>
                        <label for="${noteId}">Notes</label><br />
                        <textarea id="${noteId}" rows="10" cols="38" placeholder="Add a note..."></textarea><br />
                        <button id="${removeID}" class="map-action-button remove-marker-button" type="button">Remove</button>
                    </div>
                `);

                leafletMarker.on('popupopen', () => {
                    const textarea = document.getElementById(noteId);
                    const removeButton = document.getElementById(removeID);
                    if (!textarea) return;
                    textarea.value = markerData.notes;
                    textarea.focus();
                    textarea.addEventListener('input', () => {
                        markerData.notes = textarea.value;
                    });

                    if (removeButton) {
                        removeButton.addEventListener('click', () => {
                            map.removeLayer(leafletMarker);
                            markerList = markerList.filter((item) => item !== markerData);
                            lines.forEach(element => {
                                if (element.from === markerData || element.to === markerData) {
                                    map.removeLayer(element.polyLine);
                                    lines = lines.filter((line) => line.from !== markerData && line.to !== markerData);
                                }
                            });
                        }, { once: true });
                    }
                });
            };

            //Save Markers
            function saveMarkers(slotNumber) {
                if (![1, 2, 3].includes(slotNumber)) return;

                //Data object
                let data = [];

                //Iterate over each marker
                for (let i = 0; i < markerList.length; i++) {
                    const markerData = markerList[i];
                    data.push({
                        'location': markerData.marker.getLatLng(),
                        'notes': markerData.notes
                    });
                }

                //Last step, save to storage
                localStorage.setItem(`markers_slot_${slotNumber}`, JSON.stringify(data));
                if (info) {
                    info.textContent = `Saved ${data.length} marker(s) to Slot ${slotNumber}.`;
                }

            }

            //Pull Markers
            function retrieveMarkers(slotNumber) {
                if (![1, 2, 3].includes(slotNumber)) return;

                //Get the data
                let data = localStorage.getItem(`markers_slot_${slotNumber}`);
                if (!data) {
                    if (info) {
                        info.textContent = `Slot ${slotNumber} is empty.`;
                    }
                    return;
                }
                data = JSON.parse(data);

                if (!Array.isArray(data)) {
                    if (info) {
                        info.textContent = `Slot ${slotNumber} data is invalid.`;
                    }
                    return;
                }

                //Iterate over each bit and make brand new objects
                for (let i = 0; i < data.length; i++) {
                    const markerData = data[i];
                    AddMarker(markerData.location.lat, markerData.location.lng, markerData.notes || '');
                }

                if (info) {
                    info.textContent = `Loaded ${data.length} marker(s) from Slot ${slotNumber}.`;
                }


            };

            //Save lines
            function saveLines(slotNumber) {
                if (![1, 2, 3].includes(slotNumber)) return;

                //Data object
                let data = [];

                //Iterate over each line
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    data.push({
                        'from': line.from.marker.getLatLng(),
                        'to': line.to.marker.getLatLng(),
                    });
                }

                //Last step, save to storage
                localStorage.setItem(`lines_slot_${slotNumber}`, JSON.stringify(data));
                if (info) {
                    info.textContent = `Saved ${data.length} line(s) to Slot ${slotNumber}.`;
                }

            }

            //Pull Lines
            function retrieveLines(slotNumber) {
                if (![1, 2, 3].includes(slotNumber)) return;

                //Get the data
                let data = localStorage.getItem(`lines_slot_${slotNumber}`);
                if (!data) {
                    if (info) {
                        info.textContent = `Slot ${slotNumber} is empty.`;
                    }
                    return;
                }
                data = JSON.parse(data);

                if (!Array.isArray(data)) {
                    if (info) {
                        info.textContent = `Slot ${slotNumber} data is invalid.`;
                    }
                    return;
                }

                //Iterate over each bit and make brand new objects
                for (let i = 0; i < data.length; i++) {
                    const lineData = data[i];
                    const startLatLng = [lineData.from.lat, lineData.from.lng];
                    const endLatLng = [lineData.to.lat, lineData.to.lng];
                    let startMarker = null;
                    let endMarker = null;
                    markerList.forEach(element => {
                        if (element.marker.getLatLng().equals(startLatLng)) {
                            startMarker = element;
                        }
                        if (element.marker.getLatLng().equals(endLatLng)) {
                            endMarker = element;
                        }
                    });
                    const polyLine = L.polyline([startLatLng, endLatLng]).addTo(map);

                    lines.push({
                        from: startMarker,
                        to: endMarker,
                        polyLine
                    });
                }

                if (info) {
                    info.textContent = `Loaded ${data.length} line(s) from Slot ${slotNumber}.`;
                }


            };
        </script>
        <p id="info"></p>
    </div>
</body>

</html>
